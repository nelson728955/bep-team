<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bếp · Tablet Time Clock</title><link rel="stylesheet" href="/css/app.css"><style>
*{box-sizing:border-box}body{margin:0;background:#efedeb;color:#242424;font-family:system-ui,-apple-system,sans-serif}.kiosk{min-height:100dvh;display:flex;flex-direction:column}.top{background:#faf9f9;padding:24px max(24px,env(safe-area-inset-left));min-height:230px}.top-line{position:relative;display:flex;justify-content:center;align-items:center;min-height:44px;font-size:20px;font-weight:600}.back{position:absolute;left:0;top:0;width:48px;height:44px;border:0;background:none;font-size:28px;color:#222}.identity{display:flex;align-items:center;justify-content:center;gap:16px;min-height:140px}.logo{height:58px;width:58px;object-fit:contain;border-radius:12px;background:#190800;padding:4px}.identity strong{font-size:22px}.identity small{display:block;font-size:15px;margin-top:4px}.avatar{width:62px;height:62px;border-radius:50%;background:#a7d1c8;color:#245c52;display:grid;place-items:center;font-size:24px}.content{flex:1;display:flex;justify-content:center;align-items:center;padding:28px 24px 40px}.inner{width:100%;max-width:540px}.prompt{text-align:center;margin:0 0 18px;font-size:19px}.keypad{background:white;border:1px solid #d2d0cf;border-radius:24px;overflow:hidden}.dots{display:flex;gap:20px;justify-content:center;align-items:center;height:116px;font-size:42px}.pad{display:grid;grid-template-columns:repeat(3,1fr)}.pad button{height:100px;border:0;border-top:1px solid #d2d0cf;border-right:1px solid #d2d0cf;border-radius:0;background:white;font-size:38px;color:#282828}.pad button:nth-child(3n){border-right:0}.pad button:nth-child(10),.pad button:nth-child(12){font-size:19px;font-weight:600}.pad button:active{background:#e3e5e9}.primary{width:100%;min-height:64px;background:#1e3e73;color:white;border:0;border-radius:40px;font-size:20px;font-weight:600;margin-top:24px}.primary:disabled{background:#d0cece;color:#858585}.danger{background:#e76669}.card{background:white;border:0;border-radius:24px;padding:26px;box-shadow:none;margin-top:20px}.shift-heading{font-size:28px;margin:0 0 6px}.shift-date{margin:0;font-size:16px}.shift-info{display:flex;align-items:center;gap:16px;margin-bottom:38px}.role-mark{width:54px;height:54px;border-radius:50%;background:#505050;color:white;display:grid;place-items:center;font-size:24px;flex-shrink:0}.shift-info strong{font-size:19px}.shift-info small{display:block;margin-top:5px}.message{text-align:center;color:#9b2424;min-height:0;margin-top:14px}.setup{background:white;padding:24px;border-radius:20px}.setup a{display:block;margin:18px 0}.setup button{width:100%;min-height:54px}.tools{text-align:center;padding:0 20px 16px}.tools button{border:0;background:none;color:#555;padding:12px;font-size:14px}.confirmation{border:0;border-radius:24px;padding:32px;width:min(440px,calc(100vw - 40px));text-align:center;box-shadow:0 10px 50px #0003}.confirmation::backdrop{background:#0009}.confirmation .avatar{width:86px;height:86px;font-size:36px;margin:0 auto 20px}.confirmation h2{margin:12px 0}.confirmation p{margin:8px 0 26px}.confirmation .primary{margin-top:10px}button{cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #71b4e9;outline-offset:3px}[hidden]{display:none!important}@media(min-width:900px) and (max-height:900px){.top{min-height:160px;padding-top:12px}.identity{min-height:90px}.content{padding:20px}.inner{max-width:460px}.pad button{height:66px}.dots{height:76px}.primary{min-height:56px}.tools{padding-bottom:8px}}@media(max-width:600px){.top{min-height:200px}.top-line{font-size:16px}.identity strong{font-size:20px}.pad button{height:82px}.dots{height:100px}.content{padding:24px 20px}.primary{min-height:60px}}
</style></head><body><main class="kiosk"><header class="top"><div class="top-line"><button class="back" id="back" aria-label="Back to keypad" hidden>←</button><span id="clock"></span></div><div class="identity" id="identity"><img class="logo" src="/img/bep-logo.png" alt="Bếp"><div><strong id="name">Bếp Restaurant</strong><small>Bếp · Cuisine Vietnamienne</small></div></div></header><div class="content"><div class="inner"><section id="setup" class="setup" hidden><p>Sign in as a manager, then activate this tablet. Activation signs the manager out.</p><a href="/#/dashboard">Manager sign-in</a><button class="primary" id="activate">Activate tablet</button></section><section id="terminal" hidden><p class="prompt">Enter your Punch ID</p><div class="keypad"><div class="dots" id="dots" aria-label="Work ID, zero digits entered"></div><div class="pad" id="pad"></div></div><button class="primary" id="punch" disabled>Sign In</button><div class="message" id="message" role="status" aria-live="polite"></div></section><section id="employee" hidden></section></div></div><div class="tools"><button id="fullscreen">Full screen</button></div></main><dialog class="confirmation" id="confirmation"><div class="avatar" id="confirm-avatar">✓</div><h2 id="confirm-title"></h2><p id="confirm-message"></p><button class="primary" id="confirm-ok">OK</button></dialog><script type="module" src="/js/kiosk.js"></script></body></html>
