<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bếp · Tablet Time Clock</title><link rel="stylesheet" href="/css/app.css"><style>
body{margin:0;background:#f5f0e5}main{max-width:480px;margin:0 auto;padding:24px}header{text-align:center;margin-bottom:24px}.logo{height:90px;background:#190800;border-radius:14px;padding:12px}h1{margin:18px 0 8px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:76px;font-size:26px;border:1px solid #d6c7b3;border-radius:12px;background:#fff}.dots{text-align:center;font-size:36px;letter-spacing:14px;padding:20px;background:white;border-radius:12px;margin-bottom:14px}.punch{width:100%;margin-top:16px;min-height:58px;font-size:20px}.message{text-align:center;min-height:52px;font-size:18px;margin:16px 0}.setup{padding:20px;background:white;border-radius:12px}.tools{display:flex;justify-content:center;gap:12px;margin-top:20px}button{touch-action:manipulation} [hidden]{display:none!important}
</style></head><body><main><header><img class="logo" src="/img/bep-logo.png" alt="Bếp"><h1 id="name">Tablet Time Clock</h1><div id="clock"></div></header><section class="setup" id="setup" hidden><p>Sign in as a manager in this browser, then activate the tablet. Activation signs the manager out and leaves only the punch screen available.</p><a href="/#/dashboard">Manager sign-in</a><button class="btn btn-primary" id="activate">Activate tablet</button></section><section id="terminal" hidden><p style="text-align:center">Enter your four-digit work ID</p><div class="dots" id="dots" aria-label="Work ID, zero digits entered">○○○○</div><div class="pad" id="pad"></div><button class="btn btn-primary punch" id="punch" disabled>Punch in / out</button><div class="message" id="message" role="status" aria-live="polite"></div></section><div class="tools"><button class="btn" id="fullscreen">Full screen</button></div></main><script type="module" src="/js/kiosk.js"></script></body></html>
