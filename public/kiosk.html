ead><body><main><header><img class="logo" src="/img/bep-logo.png" alt="Bếp"><h1 id="name">Tablet Time Clock</h1><div id="clock"></div></header><section class="setup" id="setup" hidden><p>Sign in as a manager in this browser, then activate the tablet. Activation signs the manager out and leaves only the punch screen available.</p><a href="/#/dashboard">Manager sign-in</a><button class="btn btn-primary" id="activate">Activate tablet</button></section><section id="terminal" hidden><p style="text-align:center">Enter your four-digit work ID</p><div class="dots" id="dots" aria-label="Work ID, zero digits entered">○○○○</div><div class="pad" id="pad"></div><button class="btn btn-primary punch" id="punch" disabled>Punch in / out</button><div class="message" id="message" role="status" aria-live="polite"></div></section><div class="tools"><button class="btn" id="fullscreen">Full screen</button></div></main><script type="module" src="/js/kiosk.js"></script></body></html>
