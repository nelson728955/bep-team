<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShiftHub</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f26b3a'/><path d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <script>
    // Apply the last-used theme before first paint so the page does not flash the wrong colors.
    try { document.documentElement.dataset.theme = localStorage.getItem('shifthub-theme') || 'bep'; } catch { document.documentElement.dataset.theme = 'bep'; }
  </script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tooltip" role="tooltip"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
